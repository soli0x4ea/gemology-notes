function wlToX(wl, x0, x1){ // 380nm -> x0, 750nm -> x1 (linear)
  return x0 + (wl-380)/(750-380)*(x1-x0);
}

function renderSpectrumSVG(key){
  // Returns HTML string for spectrum card, or '' if no data or non-gem key
  const data = SPECTRA[key];
  if(!data) return '';
  const hasFeatures = (data.lines&&data.lines.length)||(data.bands&&data.bands.length)||(data.emiss&&data.emiss.length);
  const W=820, H=90;         // internal SVG coord; scale via CSS
  const padL=38, padR=18, padT=22, padB=28;
  const barH = 22;
  const barY = padT;
  const x0 = padL, x1 = W-padR;
  // Rainbow stops (visible spectrum)
  const stops = [
    [380,'#5500aa'], [420,'#3300ff'], [450,'#0044ff'], [470,'#0099ff'],
    [490,'#00cc66'], [520,'#00dd00'], [560,'#aadd00'], [585,'#ffdd00'],
    [610,'#ff8800'], [650,'#ff3300'], [700,'#cc0000'], [750,'#660000']
  ];
  let gradStops='';
  stops.forEach(s=>{
    const pct = ((s[0]-380)/(750-380))*100;
    gradStops+=`<stop offset="${pct.toFixed(1)}%" stop-color="${s[1]}"/>`;
  });
  // Draw bands first (behind lines)
  let bandSvg='';
  if(data.bands){
    data.bands.forEach(b=>{
      const xa = wlToX(Math.max(b.from,380),x0,x1);
      const xb = wlToX(Math.min(b.to,750),x0,x1);
      const width = Math.max(2,xb-xa);
      const op = b.intensity||0.35;
      bandSvg+=`<rect x="${xa}" y="${barY}" width="${width}" height="${barH}" fill="#000" opacity="${op}"/>`;
    });
  }
  // Sharp lines
  let lineSvg='';
  const drawnLabels = new Set();
  const labelPositions = []; // {x,nm,diag}
  if(data.lines){
    data.lines.forEach(wl=>{
      if(wl<380||wl>750) return;
      const x = wlToX(wl,x0,x1);
      const isDiag = data.diag && data.diag.some(d=>Math.abs(d-wl)<1.5);
      const w = isDiag?2.2:1.2;
      lineSvg+=`<rect x="${x-w/2}" y="${barY-3}" width="${w}" height="${barH+6}" fill="#000" opacity="${isDiag?1:0.75}"/>`;
      labelPositions.push({x, wl, diag:isDiag});
    });
  }
  // Emission lines (bright, e.g. ruby R-lines)
  let emissSvg='';
  if(data.emiss){
    data.emiss.forEach(wl=>{
      if(wl<380||wl>750) return;
      const x = wlToX(wl,x0,x1);
      emissSvg+=`<rect x="${x-1.2}" y="${barY-2}" width="2.4" height="${barH+4}" fill="#fff" opacity="0.95"/>`;
      labelPositions.push({x, wl, diag:true, emiss:true});
    });
  }
  // Wavelength axis ticks + labels (every 50 nm)
  let ticks='', labels='';
  for(let wl=400;wl<=700;wl+=50){
    const x = wlToX(wl,x0,x1);
    const isMajor = (wl%100===0);
    ticks+=`<line x1="${x}" y1="${barY+barH}" x2="${x}" y2="${barY+barH+(isMajor?6:3)}" stroke="currentColor" stroke-width="1" opacity="0.4"/>`;
    if(isMajor){
      labels+=`<text x="${x}" y="${barY+barH+18}" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.65" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">${wl}</text>`;
    }
  }
  // Axis label (nm)
  const axisLabel=`<text x="${x1}" y="${barY+barH+18}" font-size="9" text-anchor="end" fill="currentColor" opacity="0.5">nm</text>`;

  // Labels above bar: ALL sharp lines get wavelength numbers.
  // Diag lines: bold black, font 10. Non-diag: dimmer, font 9, only if not too close to a labeled one.
  labelPositions.sort((a,b)=>a.x-b.x);
  let lastX = -100;
  let labelSvg='';
  // Two passes: first pass diag (bold), second pass non-diag (lighter, smaller; skip if too close to already placed label)
  const placeLabel=(lp,isPrimary)=>{
    const txt = Number.isInteger(lp.wl) ? String(lp.wl) : lp.wl.toFixed(1);
    const fontSize = isPrimary?10:8.5;
    const textW = txt.length*fontSize*0.62;
    let tx = lp.x;
    if(tx - textW/2 < x0) tx = x0 + textW/2;
    if(tx + textW/2 > x1) tx = x1 - textW/2;
    if(tx - textW/2 < lastX + 3) tx = lastX + 3 + textW/2;
    lastX = tx + textW/2;
    let color;
    if(lp.emiss) color = '#ffaa22';
    else if(isPrimary) color = 'currentColor';
    else color = 'currentColor';
    const opacity = isPrimary?1:0.6;
    const fontWeight = isPrimary?'700':'500';
    const tickH = isPrimary?12:8;
    const tickY1 = barY-2;
    labelSvg+=`<line x1="${lp.x}" y1="${tickY1}" x2="${lp.x}" y2="${barY-tickH}" stroke="${color}" stroke-width="1" opacity="${opacity}"/>`;
    labelSvg+=`<text x="${tx}" y="${barY-tickH-2}" font-size="${fontSize}" text-anchor="middle" fill="${color}" opacity="${opacity}" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="${fontWeight}">${txt}</text>`;
  };
  labelPositions.filter(lp=>lp.diag).forEach(lp=>placeLabel(lp,true));
  labelPositions.filter(lp=>!lp.diag).forEach(lp=>placeLabel(lp,false));

  // Purple/red fade at edges for out-of-range near-UV/IR
  const edgeFade = `
    <rect x="${x0}" y="${barY}" width="10" height="${barH}" fill="url(#edgeL)"/>
    <rect x="${x1-10}" y="${barY}" width="10" height="${barH}" fill="url(#edgeR)"/>
  `;

  const svg = `
<svg class="spectrum-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="color:var(--text)">
  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">${gradStops}</linearGradient>
    <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- rainbow bar -->
  <rect x="${x0}" y="${barY}" width="${x1-x0}" height="${barH}" fill="url(#rainbow)" rx="2"/>
  ${bandSvg}
  ${lineSvg}
  ${emissSvg}
  ${edgeFade}
  ${labelSvg}
  ${ticks}
  ${labels}
  ${axisLabel}
</svg>`;

  const noteNoFeat = hasFeatures ? '' : '<div class="spectrum-empty">可见光区无明显诊断吸收线</div>';
  return `<div class="spectrum-card">
    <div class="spectrum-title"><span class="dot"></span>可见吸收光谱（380–750 nm）</div>
    <div class="spectrum-wrap">${svg}${noteNoFeat}</div>
  </div>`;
}

  function renderRestricted(el, files, restrictOpen, typeName, firstActive){
    files.forEach((f,i)=>{
      const d=document.createElement('div');
      const isLocked = restrictOpen != null && i >= restrictOpen;
      let cls='nav-item';
      if(firstActive && i===0) cls+=' active';
      if(isLocked) cls+=' locked';
      d.className=cls;
      const hasCif = f.cif && f.cif.endsWith('.cif');
      const hasSmorfHabit = f.struct && typeof SMORF_DATA !== 'undefined' && SMORF_DATA[f.struct] && SMORF_DATA[f.struct].forms && SMORF_DATA[f.struct].forms.length > 0;
      const isNonCrystal = f.cif && f.cif.endsWith('.txt') && f.name.includes('欧泊');
      let badge='';
      if(hasCif||hasSmorfHabit){badge='<span class="nav-badge has3d">3D</span>';}
      else if(isNonCrystal){badge='<span class="nav-badge no3d">非晶</span>';}
      else if(!f.cif){badge='<span class="nav-badge no3d">—</span>';}
      if(isLocked){badge+='<span class="nav-badge" style="background:rgba(255,100,80,.15);color:#e06050">🔒</span>';}
      d.innerHTML=`<span class="nav-dot" style="background:${f.color}"></span>${f.name}${badge}`;
      if(!isLocked){
        d.onclick=()=>loadFile(f.file,typeName,i);
      }
      d.dataset.file=f.file;
      el.appendChild(d);
    });
  }

  let gemsWith3D=0,gemsNo3D=0;
  renderRestricted(gEl, GEM_FILES, R.gems.open, 'gem', true);

  const countEl=document.getElementById('nav-gems-count');

  // 金属单质专题
  const metalsOpen = R.metals ? R.metals.open : undefined;
  renderRestricted(mEl, METAL_FILES, metalsOpen, 'metal', false);
  const mCountEl=document.getElementById('nav-metals-count');
  if(mCountEl)mCountEl.textContent=`${METAL_FILES.length}种`;
  const mTitle=mCountEl&&mCountEl.parentElement;
  if(mTitle&&R.metals&&R.metals.open===0)mTitle.classList.add('locked-section');

  // 玉石专题
  const jadesOpen = R.jades ? R.jades.open : undefined;
  renderRestricted(jEl, JADE_FILES, jadesOpen, 'jade', false);
  const jc=document.getElementById('nav-jades-count');
  if(jc)jc.textContent=`${JADE_FILES.length}篇`;
  const jTitle=jc&&jc.parentElement;
  if(jTitle&&R.jades&&R.jades.open===0)jTitle.classList.add('locked-section');

  // 有机宝石专题
  const organicsOpen = R.organics ? R.organics.open : undefined;
  renderRestricted(oEl, ORGANIC_FILES, organicsOpen, 'organic', false);
  const oc=document.getElementById('nav-organics-count');
  if(oc)oc.textContent=`${ORGANIC_FILES.length}篇`;
  const oTitle=oc&&oc.parentElement;
  if(oTitle&&R.organics&&R.organics.open===0)oTitle.classList.add('locked-section');

  // 仪器与量子光学 — 只开放前3篇
  renderRestricted(iEl, INSTRUMENT_FILES, R.instruments.open, 'instrument', false);
  const ic=document.getElementById('nav-instruments-count');

  const iTitle=ic&&ic.parentElement;
  if(iTitle&&R.instruments.open<INSTRUMENT_FILES.length)iTitle.classList.add('locked-section');

    const d=document.createElement('div');

let currentFile='钻石_系统笔记.md',currentType='gem',currentGemIdx=0;
let currentCifData=null;

// CIF parser: parses a simple P1 CIF file (all atoms explicitly listed)
function parseCIF(text){
  const data={a:1,b:1,c:1,alpha:90,beta:90,gamma:90,Z:1,sg:'P1',sg_orig:'P1',mineral:'',formula:'',atoms:[],source:''};
  const lines=text.split(/\r?\n/);
  let inLoop=false;
  let loopHeaders=[];
  let loopDataStart=false;
  for(let line of lines){
    line=line.trim();
    if(line.startsWith('_cell_length_a '))data.a=parseFloat(line.split(/\s+/)[1]);
    else if(line.startsWith('_cell_length_b '))data.b=parseFloat(line.split(/\s+/)[1]);
    else if(line.startsWith('_cell_length_c '))data.c=parseFloat(line.split(/\s+/)[1]);
    else if(line.startsWith('_cell_angle_alpha '))data.alpha=parseFloat(line.split(/\s+/)[1]);
    else if(line.startsWith('_cell_angle_beta '))data.beta=parseFloat(line.split(/\s+/)[1]);
    else if(line.startsWith('_cell_angle_gamma '))data.gamma=parseFloat(line.split(/\s+/)[1]);
    else if(line.startsWith('_cell_formula_units_Z '))data.Z=parseInt(line.split(/\s+/)[1]);
    else if(line.startsWith('_symmetry_space_group_name_H-M '))data.sg=line.replace(/^_symmetry_space_group_name_H-M\s+/,'').replace(/['"]/g,'').trim();
    else if(line.startsWith('_symmetry_original_H-M '))data.sg_orig=line.replace(/^_symmetry_original_H-M\s+/,'').replace(/['"]/g,'').trim();
    else if(line.startsWith('_chemical_name_common '))data.mineral=line.replace(/^_chemical_name_common\s+/,'').replace(/['"]/g,'').trim();
    else if(line.startsWith('_chemical_formula_sum '))data.formula=line.replace(/^_chemical_formula_sum\s+/,'').replace(/['"]/g,'').trim();
    else if(line.startsWith('_citation_journal_full '))data.source=line.replace(/^_citation_journal_full\s+/,'').replace(/['"]/g,'').trim();
    else if(line.startsWith('_citation_author_name '))data.source=(line.replace(/^_citation_author_name\s+/,'').replace(/['"]/g,'').trim())+' '+data.source;
    else if(line.startsWith('loop_')){inLoop=true;loopHeaders=[];loopDataStart=false;continue;}
    else if(inLoop&&line.startsWith('_')){loopHeaders.push(line);continue;}
    else if(inLoop&&loopHeaders.length>0&&!line.startsWith('_')&&line.length>0&&!line.startsWith('#')){
      // Check if this is the atom_site loop
      if(loopHeaders.includes('_atom_site_fract_x')){
        const idx={};
        loopHeaders.forEach((h,i)=>{idx[h]=i;});
        while(line.length>0){
          // Split, handling quoted strings
          const toks=[];let rest=line;
          while(rest.length>0){
            rest=rest.trim();
            if(rest.startsWith("'")){const m=rest.match(/^'([^']*)'\s*(.*)/);if(m){toks.push(m[1]);rest=m[2];}else break;}
            else if(rest.startsWith('"')){const m=rest.match(/^"([^"]*)"\s*(.*)/);if(m){toks.push(m[1]);rest=m[2];}else break;}
            else{const m=rest.match(/^(\S+)\s*(.*)/);if(m){toks.push(m[1]);rest=m[2];}else break;}
          }
          if(toks.length>=loopHeaders.length){
            const typ=toks[idx['_atom_site_type_symbol']];
            const x=parseFloat(toks[idx['_atom_site_fract_x']]);
            const y=parseFloat(toks[idx['_atom_site_fract_y']]);
            const z=parseFloat(toks[idx['_atom_site_fract_z']]);
            let occ=1;if(idx['_atom_site_occupancy']!==undefined)occ=parseFloat(toks[idx['_atom_site_occupancy']]);
            if(!isNaN(x)&&!isNaN(y)&&!isNaN(z)&&typ){
              data.atoms.push({el:typ,x,y,z,occ});
            }
          }
          break; // only one line per loop entry in our P1 CIFs
        }
      }else{inLoop=false;}
    }
    else if(inLoop&&line===''){inLoop=false;}
  }
  return data;
}

async function loadFile(file,type,gemIdx){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const target=[...document.querySelectorAll('.nav-item')].find(n=>n.dataset.file===file);
  if(target)target.classList.add('active');
  currentFile=file;currentType=type;currentGemIdx=gemIdx;currentCifData=null;

  const content=document.getElementById('doc-content');
  content.innerHTML='<div class="loading">正在加载 '+file+' ...</div>';
  try{
    const resp=await fetch(encodeURI(file));
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    let md=await resp.text();
    marked.setOptions({breaks:false,gfm:true});
    // Protect LaTeX math from being mangled by Markdown parser:
    // replace $$...$$, \[...\], $...$, \(...\) with placeholders, then restore after parsing
    const mathStore=[];
    const protect=(regex,display)=>{
      md=md.replace(regex,(m,inner)=>{
        const idx=mathStore.length;
        mathStore.push({src:m,display});
        return `MATHPLACEHOLDER${idx}ENDMATH`;
      });
    };
    // Block math first (must come before inline to avoid $$ matching $)
    protect(/\$\$([\s\S]+?)\$\$/g,true);
    protect(/\\\[([\s\S]+?)\\\]/g,true);
    // Inline math: avoid matching $$ (already replaced), escaped \$, or $ inside code
    protect(/(?<!\\)\$([^\$\n]+?)(?<!\\)\$/g,false);
    protect(/\\\(([\s\S]+?)\\\)/g,false);
    let html=marked.parse(md);
    // Restore placeholders with original LaTeX source wrapped in spans
    html=html.replace(/MATHPLACEHOLDER(\d+)ENDMATH/g,(_,i)=>{
      const m=mathStore[parseInt(i)];
      // Use script type text/plain as a safe tag that won't be parsed, then replace on DOM side
      if(m.display)return `<span class="katex-block">${m.src}</span>`;
      return `<span class="katex-inline">${m.src}</span>`;
    });
    content.innerHTML=html;
    // Inject visible absorption spectrum bar before the first <h2> (概述) for gem notes
    if((type==='gem'||type==='metal')&&gemIdx!==undefined){
      const gem = type==='metal' ? METAL_FILES[gemIdx] : GEM_FILES[gemIdx];
      const cnName = gem.name.split(/\s/)[0]; // extract Chinese part before first space
      const specHtml = renderSpectrumSVG(cnName);
      if(specHtml){
        const firstH2 = content.querySelector('h2');
        if(firstH2){
          const wrap = document.createElement('div');
          wrap.innerHTML = specHtml;
          firstH2.parentNode.insertBefore(wrap.firstElementChild, firstH2);
        }else{
          content.insertAdjacentHTML('afterbegin', specHtml);
        }
      }
    }
    // Render math with KaTeX auto-render (wait for KaTeX to load if needed)
    const renderMath=()=>{
      if(window.renderMathInElement){
        try{
          renderMathInElement(content,{
            delimiters:[
              {left:'$$',right:'$$',display:true},
              {left:'\\[',right:'\\]',display:true},
              {left:'$',right:'$',display:false},
              {left:'\\(',right:'\\)',display:false}
            ],
            throwOnError:false,
            errorColor:'#cc4444',
            strict:'ignore',
            trust:false
          });
        }catch(e){console.warn('KaTeX render error:',e);}
      }else{
        setTimeout(renderMath,80);
      }
    };
    renderMath();
    document.querySelector('.doc-area').scrollTop=0;
  }catch(e){
    content.innerHTML=`<div class="error-msg">无法加载 ${file}<br>${e.message}<br><small>请通过本地HTTP服务器访问（python3 -m http.server）</small></div>`;
  }

  if((type==='gem'||type==='metal')&&gemIdx!==undefined){
    const gem = type==='metal' ? METAL_FILES[gemIdx] : GEM_FILES[gemIdx];
    document.getElementById('header-meta').textContent=gem.name;
    const hasSmorf = gem.struct && hasSmorfData(gem.struct);
    if(gem.cif){
      try{
        const resp=await fetch(encodeURI(gem.cif));
        if(!resp.ok)throw new Error('CIF HTTP '+resp.status);
        if(gem.cif.endsWith('.cif')){
          const cifText=await resp.text();
          currentCifData=parseCIF(cifText);
          displayCrystal(currentCifData,gem);

        }else{
          // .txt placeholder: charoite (结构未解析) or opal (非晶质)
          if(gem.name.includes('欧泊')){
            showNoCrystal('欧泊为非晶质（SiO₂水合球粒），无晶体结构');
          }else{
            // 有smorf数据则显示晶形，否则提示
            if(hasSmorf){
              curCif=null;curGem=gem;
              _currentFormIdx = getSmorfDefaultFormIdx(gem.struct);
              const panel=document.getElementById('crystal-panel');
              panel.classList.remove('collapsed');
              document.getElementById('three-canvas').style.display='block';
              document.getElementById('viewer-hint').style.display='block';
              if(!scene)initThree();
              requestAnimationFrame(()=>onResize());
              switchView('habit');
            }else{
              showNoCrystal(gem.name+' 单晶结构未完全解析（纳米级多矿物交生）');
            }
          }
        }
      }catch(e){
        // CIF加载失败，但有smorf数据则回退到晶形视图
        if(hasSmorf){
          curCif=null;curGem=gem;
          _currentFormIdx = getSmorfDefaultFormIdx(gem.struct);
          const panel=document.getElementById('crystal-panel');
          panel.classList.remove('collapsed');
          document.getElementById('three-canvas').style.display='block';
          document.getElementById('viewer-hint').style.display='block';
          if(!scene)initThree();
          requestAnimationFrame(()=>onResize());
          switchView('habit');
        }else{
          showNoCrystal(gem.name+' CIF加载失败: '+e.message);
        }
      }
    }else if(hasSmorf){
      // 无CIF但有smorf晶形数据：直接显示晶形视图
      curCif=null;curGem=gem;
      _currentFormIdx = getSmorfDefaultFormIdx(gem.struct);
      const panel=document.getElementById('crystal-panel');
      panel.classList.remove('collapsed');
      document.getElementById('three-canvas').style.display='block';
      document.getElementById('viewer-hint').style.display='block';
      if(!scene)initThree();
      requestAnimationFrame(()=>onResize());
      switchView('habit');
    }else{
      showNoCrystal(gem.name+' 的晶体数据待补充');
    }
  }else{
    const msg = type==='instrument'?'仪器/光学专题文档无3D晶体模型'
              : type==='jade'?'玉石专题为多矿物集合体，无单晶3D模型'
              : type==='organic'?'有机宝石为生物成因材料，无单晶3D模型'
              : type==='metal'?'金属单质'
              : '辅助文档';
    if(type==='metal'){
      // metals should always have crystal data, but fallback
      showNoCrystal('金属单质晶体数据加载中...');
    }else{
      showNoCrystal(msg);
    }
    const info=METAL_FILES.find(f=>f.file===file)||JADE_FILES.find(f=>f.file===file)||ORGANIC_FILES.find(f=>f.file===file)||INSTRUMENT_FILES.find(f=>f.file===file)||AUX_FILES.find(f=>f.file===file);
    document.getElementById('header-meta').textContent=info?info.name:'';
  }
}

// fractional -> Cartesian for general triclinic/monoclinic/orthorhombic/hexagonal/tetragonal/cubic cells
function cellMat(a,b,c,alD,beD,gaD){
  const al=alD*Math.PI/180,be=beD*Math.PI/180,ga=gaD*Math.PI/180;
  const ca=Math.cos(al),cb=Math.cos(be),cg=Math.cos(ga),sg=Math.sin(ga);
  const v=Math.sqrt(1-ca*ca-cb*cb-cg*cg+2*ca*cb*cg);
  return new THREE.Matrix3().set(
    a,b*cg,c*cb,
    0,b*sg,c*(ca-cb*cg)/sg,
    0,0,c*v/sg
  );
}
function f2c(fx,fy,fz,M){
  const e=M.elements;
  return new THREE.Vector3(e[0]*fx+e[3]*fy+e[6]*fz, e[1]*fx+e[4]*fy+e[7]*fz, e[2]*fx+e[5]*fy+e[8]*fz);
}

// ---- polyhedron helpers ----
// For tetrahedron: any 4 non-coplanar points -> generate all 4 faces (C(4,3)=4)
function makeTetraGeom(verts){
  const pos=[],nrm=[];
  const [[a,b,c,d]]=[verts];
  const centroid=new THREE.Vector3().add(a).add(b).add(c).add(d).multiplyScalar(0.25);
  const faces=[[a,b,c],[a,b,d],[a,c,d],[b,c,d]];
  faces.forEach(([p,q,r])=>{
    const u=new THREE.Vector3().subVectors(q,p), v=new THREE.Vector3().subVectors(r,p);
    const n=new THREE.Vector3().crossVectors(u,v);
    const faceCenter=new THREE.Vector3().add(p).add(q).add(r).multiplyScalar(1/3);
    const outward=new THREE.Vector3().subVectors(faceCenter,centroid);
    if(n.dot(outward)<0)n.negate();
    n.normalize();
    [p,q,r].forEach(v=>{pos.push(v.x,v.y,v.z);nrm.push(n.x,n.y,n.z);});
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  return g;
}

// For triangle (CN=3, planar groups like [CO3])
function makeTriGeom(verts){
  const [a,b,c]=verts;
  const u=new THREE.Vector3().subVectors(b,a),v=new THREE.Vector3().subVectors(c,a);
  const n=new THREE.Vector3().crossVectors(u,v).normalize();
  // also add the back face for visibility from both sides
  const pos=[a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z,  a.x,a.y,a.z,c.x,c.y,c.z,b.x,b.y,b.z];
  const nrm=[n.x,n.y,n.z,n.x,n.y,n.z,n.x,n.y,n.z,  -n.x,-n.y,-n.z,-n.x,-n.y,-n.z,-n.x,-n.y,-n.z];
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  return g;
}

// For cube (CN=8): vertices must be ordered as:
// [+x+y+z,-x+y+z,-x-y+z,+x-y+z,+x+y-z,-x+y-z,-x-y-z,+x-y-z]
function makeCubeGeom(verts){
  const pos=[],nrm=[];
  const [ppp,mpp,mmp,pmp,ppm,mpm,mmm,pmm]=verts;
  // 6 faces, 2 triangles each (12 triangles)
  const faces=[
    [ppp,mpp,mmp,pmp],[pmm,mmm,mpm,ppm], // +z,-z
    [mpp,mmp,mmm,mpm],[pmp,pmm,ppm,ppp], // -x,+x
    [ppp,ppm,mpm,mpp],[pmp,mmp,mmm,pmm], // +y,-y
  ];
  faces.forEach(f=>{
    const [a,b,c,d]=f;
    const u=new THREE.Vector3().subVectors(b,a),v=new THREE.Vector3().subVectors(d,a);
    const n=new THREE.Vector3().crossVectors(u,v).normalize();
    // two triangles
    [[a,b,c],[a,c,d]].forEach(t=>{
      t.forEach(vx=>{pos.push(vx.x,vx.y,vx.z);nrm.push(n.x,n.y,n.z);});
    });
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  return g;
}

function addPolyhedron(verts,color,opacity){
  let g;
  if(verts.length===4) g=makeTetraGeom(verts);
  else if(verts.length===3) g=makeTriGeom(verts);
  else if(verts.length===8) g=makeCubeGeom(verts);
  else return;
  const mat=new THREE.MeshPhongMaterial({color,transparent:true,opacity:opacity||0.3,side:THREE.FrontSide,shininess:30,flatShading:true});
  const mesh=new THREE.Mesh(g,mat);crystalGroup.add(mesh);
  // edges
  const edges=new THREE.EdgesGeometry(g,1);
  const line=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:color,opacity:0.5,transparent:true}));
  crystalGroup.add(line);
}

// ---- unit cell outline (dashed) ----
function addCellBox(M,nx,ny,nz){
  const va=f2c(nx,0,0,M),vb=f2c(0,ny,0,M),vc=f2c(0,0,nz,M);
  const o=new THREE.Vector3(0,0,0);
  const pts=[
    o,va,va.clone().add(vb),vb,o,
    o,vc,vc.clone().add(va),va.clone().add(vb).add(vc),vb.clone().add(vc),vc,
    va,va.clone().add(vc),va.clone().add(vb).add(vc),
    vb,vb.clone().add(vc),vb.clone().add(vc).add(va),
  ];
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineDashedMaterial({color:0xc9a84c,dashSize:0.12,gapSize:0.08,opacity:0.6,transparent:true});
  _tracked.cellMats.push(mat);
  const line=new THREE.Line(g,mat);line.computeLineDistances();
  crystalGroup.add(line);
}

// ---- build crystal from CIF data ----
function buildCrystalFromCIF(cif,supercellN){
  clearCrystal();
  const M=cellMat(cif.a,cif.b,cif.c,cif.alpha,cif.beta,cif.gamma);
  // Determine supercell size: aim for ~60-120 atoms max
  const n=cif.atoms.length;
  let nx=1,ny=1,nz=1;
  if(n<15){nx=2;ny=2;nz=2;}
  else if(n<30){nx=2;ny=2;nz=1;}
  else if(n<60){nx=1;ny=1;nz=1;}
  if(cif.a>10||cif.b>10||cif.c>10){nx=Math.min(nx,1);ny=Math.min(ny,1);nz=Math.min(nz,1);}
  if(supercellN){nx=supercellN[0];ny=supercellN[1];nz=supercellN[2];}

  const atoms=[];
  for(let ix=0;ix<nx;ix++)for(let iy=0;iy<ny;iy++)for(let iz=0;iz<nz;iz++){
    cif.atoms.forEach(a=>{
      let fx=a.x+ix,fy=a.y+iy,fz=a.z+iz;
      // wrap fractional coordinates to [0,1) relative to supercell origin
      fx=fx-Math.floor(fx/(nx))*nx;
      fy=fy-Math.floor(fy/(ny))*ny;
      fz=fz-Math.floor(fz/(nz))*nz;
      const v=f2c(fx,fy,fz,M);
      const el=a.el.replace(/[0-9+-]/g,'').substring(0,2);
      const el1=a.el.replace(/[0-9+-]/g,'');
      const elem=el1.charAt(0).toUpperCase()+el1.charAt(1).toLowerCase();
      atoms.push({el:elem,vec:v,r:AR[elem]||0.5,c:AC[elem]||0xffffff});
    });
  }

  // bonds (auto-detect by distance)
  if(showBonds){
    // Use typical bond cutoffs by element pairs
    const bondMat=new THREE.MeshPhongMaterial({color:0x7090b0,shininess:20});
    _tracked.bondMats.push(bondMat);
    const cutoffs={
      'C-C':1.7,'C-O':1.5,'Si-O':1.8,'Al-O':2.1,'Mg-O':2.3,'Ca-O':2.6,
      'Fe-O':2.3,'Mn-O':2.3,'Na-O':2.6,'K-O':2.9,'Ti-O':2.2,'Be-O':1.8,
      'B-O':1.6,'P-O':1.7,'Zr-O':2.3,'Ba-O':3.0,'F-Ca':2.6,'F-Mg':2.1,
      'O-O':1.6,'F-Al':1.9,
    };
    for(let i=0;i<atoms.length;i++){
      for(let j=i+1;j<Math.min(i+50,atoms.length);j++){
        const d=atoms[i].vec.distanceTo(atoms[j].vec);
        const pair=[atoms[i].el,atoms[j].el].sort().join('-');
        const cutoff=cutoffs[pair]||2.0;
        if(d<cutoff&&d>0.5){
          const dir=new THREE.Vector3().subVectors(atoms[j].vec,atoms[i].vec);
          const cylGeom=new THREE.CylinderGeometry(0.05,0.05,d,6);
          const cyl=new THREE.Mesh(cylGeom,bondMat);
          cyl.position.copy(atoms[i].vec).add(atoms[j].vec).multiplyScalar(0.5);
          cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.clone().normalize());
          crystalGroup.add(cyl);
        }
      }
    }
  }

  // atoms
  if(showAtoms){
    atoms.forEach(a=>{
      const g=new THREE.SphereGeometry(a.r*0.9,14,10);
      const mat=new THREE.MeshPhongMaterial({color:a.c,shininess:60,specular:0x333333});
      mat.userData.origColor=new THREE.Color(a.c);
      _tracked.atomMats.push(mat);
      const mesh=new THREE.Mesh(g,mat);mesh.position.copy(a.vec);
      crystalGroup.add(mesh);
    });
  }

  // unit cell box (1 cell)
  if(showCell) addCellBox(M,nx,ny,nz);

  // center camera
  const center=f2c(nx/2,ny/2,nz/2,M);
  const diag=f2c(nx,ny,nz,M).length();
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(diag*0.75,diag*0.6,diag*0.9));
  controls.update();
  apply3DTheme();
}

// ==================== Unified crystal view (cell/habit toggle) ====================
let curGem=null, curCif=null;
let _scN=[1,1,1]; // supercell size for cell mode

function displayCrystal(cif,gem){
  curCif=cif;curGem=gem;_scN=[1,1,1];
  // Reset form index to default for this mineral
  _currentFormIdx = gem.struct ? getSmorfDefaultFormIdx(gem.struct) : 0;
  const panel=document.getElementById('crystal-panel');
  panel.classList.remove('collapsed');
  document.getElementById('three-canvas').style.display='block';
  document.getElementById('viewer-hint').style.display='block';
  if(!scene)initThree();
  requestAnimationFrame(()=>onResize());
  // 默认显示晶形（原矿晶体形态），若无smorf晶形数据则回退到晶胞
  const hasHabit = gem.struct && hasSmorfData(gem.struct);
  if(hasHabit)switchView('habit');
  else switchView('cell');
}

function switchView(mode){
  viewMode=mode;
  clearCrystal();
  buildControls();
  if(mode==='cell'&&curCif){
    buildCrystalFromCIF(curCif,_scN);
    updateInfoForCell(curGem,curCif);
  }else if(mode==='habit'){
    buildHabitMesh(curGem?curGem.color:null);
    updateInfoForHabit(curGem);
  }else if(mode==='cell'&&!curCif){
    // 无晶胞数据，自动回到晶形
    viewMode='habit';
    buildControls();
    buildHabitMesh(curGem?curGem.color:null);
    updateInfoForHabit(curGem);
  }
}

function buildControls(){
  const vc=document.getElementById('viewer-controls');
  vc.innerHTML='';
  const mkSep=()=>{const s=document.createElement('span');s.className='vc-sep';return s;};
  const mkBtn=(label,active,cb,disabled)=>{
    const b=document.createElement('button');
    b.className='vc-btn'+(active?' active':'')+(disabled?' disabled':'');b.textContent=label;
    if(cb&&!disabled)b.onclick=cb;
    return b;
  };

  // ---- Always present: 晶胞 / 晶形 toggle ----
  const hasHabit = curGem && curGem.struct && hasSmorfData(curGem.struct);
  const hasCell = !!curCif;
  const cellBtn = mkBtn('晶胞',viewMode==='cell',()=>switchView('cell'),!hasCell);
  if(!hasCell){cellBtn.title='该品种暂无CIF晶胞数据';}
  vc.appendChild(cellBtn);
  const hBtn=mkBtn('晶形',viewMode==='habit',()=>switchView('habit'),!hasHabit);
  if(!hasHabit){hBtn.title='该品种暂无smorf晶形数据';}
  vc.appendChild(hBtn);
  vc.appendChild(mkSep());

  if(viewMode==='cell'){
    vc.appendChild(mkBtn('原子',showAtoms,()=>{showAtoms=!showAtoms;buildControls();buildCrystalFromCIF(curCif,_scN);}));
    vc.appendChild(mkBtn('化学键',showBonds,()=>{showBonds=!showBonds;buildControls();buildCrystalFromCIF(curCif,_scN);}));
    vc.appendChild(mkBtn('晶胞框',showCell,()=>{showCell=!showCell;buildControls();buildCrystalFromCIF(curCif,_scN);}));
    vc.appendChild(mkSep());
    vc.appendChild(mkBtn('自动旋转',autoRotate,()=>{autoRotate=!autoRotate;controls.autoRotate=autoRotate;}));
    vc.appendChild(mkBtn('重置视角',false,()=>buildCrystalFromCIF(curCif,_scN)));
    const sc1=mkBtn('1×1×1',_scN[0]===1,()=>{_scN=[1,1,1];buildControls();buildCrystalFromCIF(curCif,_scN);});
    const sc2=mkBtn('2×2×2',_scN[0]===2,()=>{_scN=[2,2,2];buildControls();buildCrystalFromCIF(curCif,_scN);});
    vc.appendChild(sc1);vc.appendChild(sc2);
  }else{
    // Habit-specific controls
    const forms = curGem && curGem.struct ? getSmorfForms(curGem.struct) : [];
    vc.appendChild(mkBtn('自动旋转',autoRotate,()=>{autoRotate=!autoRotate;controls.autoRotate=autoRotate;}));
    vc.appendChild(mkBtn('重置视角',false,()=>buildHabitMesh(curGem.color)));
    // Form selector (prev/next)
    if(forms.length>1){
      vc.appendChild(mkSep());
      vc.appendChild(mkBtn('◀',false,()=>{
        _currentFormIdx=(_currentFormIdx-1+forms.length)%forms.length;
        buildHabitMesh(curGem.color);updateInfoForHabit(curGem);buildControls();
      }));
      const lbl=document.createElement('span');
      lbl.style.cssText='font-size:11px;padding:0 4px;color:var(--text-dim);line-height:24px;';
      lbl.textContent=(_currentFormIdx+1)+'/'+forms.length;
      vc.appendChild(lbl);
      vc.appendChild(mkBtn('▶',false,()=>{
        _currentFormIdx=(_currentFormIdx+1)%forms.length;
        buildHabitMesh(curGem.color);updateInfoForHabit(curGem);buildControls();
      }));
    }
  }

  controls.autoRotate=autoRotate;
}

function updateInfoForHabit(gem){
  const info=document.getElementById('crystal-info');
  const structName = gem.struct;
  const forms = structName ? getSmorfForms(structName) : [];
  const form = forms[_currentFormIdx] || null;
  const data = structName && SMORF_DATA[structName] ? SMORF_DATA[structName] : null;

  let h='<div class="ci-title">'+gem.name+' — 原矿晶形</div>';
  if(form){
    h+='<div class="ci-formula">晶形 '+(_currentFormIdx+1)+'/'+forms.length+' · '+(form.description||form.id)+'</div>';
    if(form.isTwin){
      h+='<div class="ci-system" style="color:#ff9060">双晶形态</div>';
    }
    const counts = form.metadata.counts;
    h+='<div class="ci-system">'+counts.triFaces+'三角面 · '+counts.quadFaces+'四角面 · 共'+(counts.triFaces+counts.quadFaces)+'面</div>';
  }else{
    h+='<div class="ci-system">晶形数据加载中...</div>';
  }
  const gp=GEM_PROPS[gem.struct]||{};
  if(Object.keys(gp).length){
    h+='<div class="ci-props">';
    for(const[k,v]of Object.entries(gp)){
      h+='<div class="prop"><span class="prop-k">'+k+'</span><span class="prop-v">'+v+'</span></div>';
    }
    h+='</div>';
  }

  // Inject habit-info area (form buttons)
  h+='<div id="habit-info" style="margin-top:12px"></div>';

  info.innerHTML=h;

  // Populate habit-info after DOM insertion
  if(form && data){
    setTimeout(()=>updateHabitInfo(structName, _currentFormIdx), 0);
  }
}


function updateInfoForCell(gem,cif){
  const info=document.getElementById('crystal-info');
  let h=`<div class="ci-title">${gem.name}</div>`;
  h+=`<div class="ci-formula">${cif.formula||''}</div>`;
  h+=`<div class="ci-system">${cif.sg_orig||cif.sg}<br><small>a=${cif.a.toFixed(3)}, b=${cif.b.toFixed(3)}, c=${cif.c.toFixed(3)} Å<br>α=${cif.alpha}°, β=${cif.beta}°, γ=${cif.gamma}° · Z=${cif.Z}</small></div>`;
  h+=`<div class="ci-props">`;
  const gp=GEM_PROPS[gem.struct]||{};
  for(const[k,v]of Object.entries(gp)){
    h+=`<div class="prop"><span class="prop-k">${k}</span><span class="prop-v">${v}</span></div>`;
  }
  h+=`</div>`;
  if(cif.source){
    h+=`<div style="margin-top:12px;font-size:10px;color:var(--text-dim);border-top:1px solid var(--border);padding-top:8px;line-height:1.5">CIF来源：${cif.source.substring(0,100)}</div>`;
  }
  info.innerHTML=h;
}

// ==================== Smorf真实晶体数据支持（全量多晶形） ====================
let _currentFormIdx = 0;

function hasSmorfData(structName) {
  return typeof SMORF_DATA !== 'undefined' && SMORF_DATA && SMORF_DATA[structName] && SMORF_DATA[structName].forms && SMORF_DATA[structName].forms.length > 0;
}

function getSmorfForms(structName) {
  return hasSmorfData(structName) ? SMORF_DATA[structName].forms : [];
}

function getSmorfDefaultFormIdx(structName) {
  if (!hasSmorfData(structName)) return 0;
  return SMORF_DATA[structName].defaultForm || 0;
}

function makeSmorfGeometryForForm(structName, formIdx) {
  const data = SMORF_DATA[structName];
  if (!data || !data.forms || !data.forms[formIdx]) return null;
  const form = data.forms[formIdx];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(form.positions, 3));
  if (form.normals && form.normals.length === form.positions.length) {
    geometry.setAttribute('normal', new THREE.Float32BufferAttribute(form.normals, 3));
  } else {
    geometry.computeVertexNormals();
  }
  geometry.setIndex(form.indices);
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
  return geometry;
}

// ==================== 晶形渲染管线 ====================
let viewMode='cell'; // 'cell' | 'habit'
let habitMesh=null;
let habitEdges=null;
let habitLabels=null;

function buildHabitMesh(gemColor){
  clearCrystal();
  const theme=document.documentElement.getAttribute('data-theme')||'dark';
  const isDark=theme==='dark';

  const structName = curGem && curGem.struct;
  if (!structName || !hasSmorfData(structName)) {
    showNoCrystal(curGem ? curGem.name+' 的单晶形态数据待补充' : '无晶体数据');
    return;
  }

  const forms = getSmorfForms(structName);
  if (_currentFormIdx >= forms.length) _currentFormIdx = 0;
  const form = forms[_currentFormIdx];
  const geom = makeSmorfGeometryForForm(structName, _currentFormIdx);
  if (!geom) return;

  const crystalColor = gemColor ? new THREE.Color(gemColor) : new THREE.Color(0xb8e2ff);

  const bodyMat=new THREE.MeshPhongMaterial({
    color: crystalColor,
    transparent:true,
    opacity: isDark?0.82:0.75,
    side:THREE.DoubleSide,
    shininess:80,
    specular:0x444444,
    flatShading:true,
  });
  const m=new THREE.Mesh(geom,bodyMat);
  crystalGroup.add(m);
  habitMesh=m;

  const edgeGeom=new THREE.EdgesGeometry(geom,1);
  const edgeMat=new THREE.LineBasicMaterial({color:isDark?0xffffff:0x222222,opacity:0.9,transparent:true});
  const edges=new THREE.LineSegments(edgeGeom,edgeMat);
  crystalGroup.add(edges);
  habitEdges=edges;

  // 自动调整相机
  geom.computeBoundingBox();
  const box = geom.boundingBox;
  const center = new THREE.Vector3();
  box.getCenter(center);
  const size = new THREE.Vector3();
  box.getSize(size);
  const maxDim=Math.max(size.x,size.y,size.z);
  const dist=maxDim*2.6;
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(dist*0.55,dist*0.45,dist*0.85));
  controls.update();
}

function updateHabitInfo(structName, formIdx) {
  const infoEl = document.getElementById('habit-info');
  if (!infoEl) return;
  const data = SMORF_DATA[structName];
  const forms = data.forms;
  const form = forms[formIdx];
  const counts = form.metadata.counts;
  const totalFaces = counts.quadFaces + counts.triFaces;

  let html = '<div style="padding:8px;background:var(--panel);border-radius:6px;margin-bottom:8px">';
  html += '<div style="font-size:11px;opacity:0.6;margin-bottom:4px">真实晶形 '+(formIdx+1)+'/'+forms.length+'</div>';
  html += '<div style="font-size:12px;font-weight:600;margin-bottom:4px">'+(form.description||form.id)+'</div>';
  html += '<div style="font-size:10px;opacity:0.6">'+counts.triFaces+'三角面 · '+counts.quadFaces+'四角面 · 共'+totalFaces+'面';
  if (form.isTwin) html += ' · <span style="color:#ff9060">双晶</span>';
  html += '</div>';

  // 晶形选择按钮
  if (forms.length > 1) {
    html += '<div style="margin-top:8px;display:flex;gap:3px;flex-wrap:wrap">';
    forms.forEach((f, i) => {
      const isActive = i === formIdx;
      const isTwinMark = f.isTwin ? 'T' : '';
      html += '<button onclick="switchForm('+i+')" style="padding:2px 7px;font-size:10px;border-radius:3px;cursor:pointer;border:1px solid '+(isActive?'var(--accent)':'var(--border)')+';background:'+(isActive?'var(--accent)':'transparent')+';color:'+(isActive?'#fff':'var(--text)')+';">'+(i+1)+(isTwinMark?' '+isTwinMark:'')+'</button>';
    });
    html += '</div>';
  }
  html += '</div>';

  infoEl.innerHTML = html;
  infoEl.style.display='block';
}

function switchForm(idx) {
  _currentFormIdx = idx;
  if (viewMode === 'habit' && curGem) {
    buildHabitMesh(curGem.color);
    updateInfoForHabit(curGem);
    buildControls(); // update prev/next counter
  }
}


function clearCrystal(){
  while(crystalGroup.children.length){
    const c=crystalGroup.children[0];
    crystalGroup.remove(c);
    if(c.geometry)c.geometry.dispose();
    if(c.material){
      if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());
      else c.material.dispose();
    }
  }
  _tracked.atomMats.length=0;
  _tracked.bondMats.length=0;
  _tracked.cellMats.length=0;
  _tracked.polyMats.length=0;
  habitMesh=null;habitEdges=null;habitLabels=null;
}

// Apply lighting/material tweaks for current theme
function apply3DTheme(){
  if(!scene)return;
  const theme=document.documentElement.getAttribute('data-theme')||'dark';
  const light=_tracked.lights;
  if(light.ambient)light.ambient.intensity=theme==='light'?0.95:0.7;
  if(light.key)light.key.intensity=theme==='light'?1.05:0.9;
  if(light.fill)light.fill.intensity=theme==='light'?0.65:0.4;
  if(light.rim)light.rim.intensity=theme==='light'?0.4:0.5;
  // Dark atoms (e.g. Carbon 0x303030) become lighter in light theme
  _tracked.atomMats.forEach(m=>{
    const orig=m.userData.origColor||m.color;
    const r=Math.round(orig.r*255),g=Math.round(orig.g*255),b=Math.round(orig.b*255);
    const lum=0.299*r+0.587*g+0.114*b;
    if(theme==='light'){
      if(lum<110){
        // Lift dark atoms to a visible slate-gray with subtle self-illumination
        const lift=Math.max(120,Math.round(lum+90));
        const f=Math.min(1,lift/255);
        m.color.setRGB(
          Math.min(1,(r/255)*0.5+f*0.55),
          Math.min(1,(g/255)*0.5+f*0.55),
          Math.min(1,(b/255)*0.5+f*0.55)
        );
        m.emissive.copy(m.color);
        m.emissiveIntensity=0.25;
      }else{
        m.color.copy(orig);
        m.emissive.setHex(0x000000);m.emissiveIntensity=0;
      }
    }else{
      m.color.copy(orig);
      m.emissive.setHex(0x000000);m.emissiveIntensity=0;
    }
  });
  // Bonds / cell lines slightly darker in light theme for contrast
  const bondColor=theme==='light'?0x5a7088:0x909090;
  _tracked.bondMats.forEach(m=>m.color.setHex(bondColor));
  const cellColor=theme==='light'?0x8a6a20:0xc9a84c;
  _tracked.cellMats.forEach(m=>m.color.setHex(cellColor));
  // Habit mesh edges
  if(habitEdges&&habitEdges.material){
    habitEdges.material.color.setHex(theme==='light'?0x333333:0xffffff);
  }
  if(habitMesh&&habitMesh.material){
    habitMesh.material.opacity=theme==='light'?0.65:0.72;
    habitMesh.material.needsUpdate=true;
  }
}

function showNoCrystal(msg){
  if(crystalGroup)clearCrystal();
  const panel=document.getElementById('crystal-panel');
  panel.classList.add('collapsed');
  const canvas=document.getElementById('three-canvas');
  canvas.style.display='none';
  document.getElementById('viewer-hint').style.display='none';
  document.getElementById('viewer-controls').innerHTML='';
  document.getElementById('crystal-info').innerHTML='';
  // Force renderer to clear the canvas so old crystal doesn't linger
  if(renderer&&scene&&camera){
    renderer.clear();
  }
}

// ==================== 晶体结构从CIF动态加载 ====================

function animate(){
  animId=requestAnimationFrame(animate);
  if(controls){controls.autoRotate=autoRotate;controls.autoRotateSpeed=0.6;controls.update();}
  if(renderer&&scene&&camera)renderer.render(scene,camera);
}

// ==================== 主题切换 ====================
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme',theme);
  const btn=document.getElementById('theme-btn');
  if(btn)btn.textContent=theme==='light'?'☀':'🌙';
  try{localStorage.setItem('gem-theme',theme);}catch(e){}
  apply3DTheme();
}
function initTheme(){
  let saved=null;
  try{saved=localStorage.getItem('gem-theme');}catch(e){}
  if(saved==='light'||saved==='dark'){
    applyTheme(saved);
  }else{
    const prefersLight=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;
    applyTheme(prefersLight?'light':'dark');
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('#theme-btn');
  if(t){
    const cur=document.documentElement.getAttribute('data-theme')||'dark';
    applyTheme(cur==='dark'?'light':'dark');
  }
});

// ==================== 移动端侧边栏 ====================
function toggleSidebar(open){
  const sb=document.getElementById('sidebar');
  const bd=document.getElementById('sidebar-backdrop');
  const isOpen=open!==undefined?open:!sb.classList.contains('open');
  sb.classList.toggle('open',isOpen);
  bd.classList.toggle('open',isOpen);
}
document.addEventListener('click',e=>{
  if(e.target.closest('#menu-btn')){toggleSidebar();return;}
  if(e.target.closest('#sidebar-backdrop')){toggleSidebar(false);return;}
  // On mobile, tapping a nav item closes the sidebar
  if(window.innerWidth<=900 && e.target.closest('.nav-item')){toggleSidebar(false);}
});

// ==================== 启动 ====================
initTheme();
buildNav();
initThree();
loadFile('钻石_系统笔记.md','gem',0);
