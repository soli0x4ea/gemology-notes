<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Crystal Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d14;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#e8e8f0}
h1{font-size:1.2rem;color:#f0c040;margin-bottom:1rem;letter-spacing:.05em}
#viewer{position:relative;width:860px;height:480px;background:#080810;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
#cv{width:860px;height:480px;display:block}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,8,16,.9);color:#ff6060;font-family:monospace;font-size:13px;text-align:center;padding:20px}
#err.on{display:flex}
#ok{position:absolute;bottom:10px;right:14px;font-size:.7rem;color:rgba(0,255,100,.7);letter-spacing:.08em}
</style>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./"}}</script>
</head><body>
<h1>刚玉晶体结构 · 3D 测试</h1>
<div id="viewer">
  <canvas id="cv"></canvas>
  <div id="err"></div>
  <div id="ok">● WebGL 正常</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';

const cv = document.getElementById('cv');
const errEl = document.getElementById('err');
const okEl = document.getElementById('ok');

try {
  // ── Renderer ──
  const W = 860, H = 480;
  cv.width = W; cv.height = H;
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x080810, 1);
  renderer.shadowMap.enabled = true;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;

  // ── Scene ──
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080810);

  // ── Camera ──
  const camera = new THREE.PerspectiveCamera(42, W/H, 0.01, 300);
  camera.position.set(9, 7, 11);
  camera.lookAt(0,0,0);

  // ── Controls ──
  const ctrl = new OrbitControls(camera, cv);
  ctrl.enableDamping = true;
  ctrl.dampingFactor = 0.06;
  ctrl.autoRotate = true;
  ctrl.autoRotateSpeed = 0.5;

  // ── Lights ──
  scene.add(new THREE.AmbientLight(0x334466, 0.7));
  const sun = new THREE.DirectionalLight(0xfff0e0, 2.0);
  sun.position.set(6, 10, 8); scene.add(sun);
  const rim = new THREE.DirectionalLight(0x4a9eff, 0.9);
  rim.position.set(-6, -2, -6); scene.add(rim);
  const fill = new THREE.PointLight(0x9b59b6, 1.3, 35);
  fill.position.set(-4, 4, 2); scene.add(fill);

  // ── Crystal: 2×2×2 supercell ──
  const a = 0.477, c = 1.304, SCALE = 3.2;
  const sc = v => v * SCALE;
  const toCart = (fx, fy, fz) => {
    const x = a*(fx - fy/2), y = a*(fy*Math.sqrt(3)/2), z = c*fz;
    return new THREE.Vector3(sc(x), sc(z-c/2), sc(y));
  };
  const AlM = new THREE.MeshPhysicalMaterial({color:0x9b59b6,metalness:0.6,roughness:0.25,emissive:0x3d1a5c,emissiveIntensity:0.35});
  const OM  = new THREE.MeshPhysicalMaterial({color:0xe74c3c,metalness:0.0,roughness:0.4,emissive:0x7a1a0a,emissiveIntensity:0.25});
  const BM  = new THREE.MeshStandardMaterial({color:0x4a9eff,metalness:0.4,roughness:0.5,transparent:true,opacity:0.5,emissive:0x1a4a8a,emissiveIntensity:0.2});
  const AlGeo = new THREE.SphereGeometry(sc(0.077), 28, 28);
  const OGeo  = new THREE.SphereGeometry(sc(0.14),  28, 28);

  const group = new THREE.Group();
  scene.add(group);

  const O18e=[[0.108,0.306,0.033],[-0.108,-0.306,0.033],[0.306,0.198,0.033],[-0.306,-0.198,0.033],[-0.198,0.108,0.033],[0.198,-0.108,0.033],[0.108,0.306,0.533],[-0.108,-0.306,0.533],[0.306,0.198,0.533],[-0.306,-0.198,0.533],[-0.198,0.108,0.533],[0.198,-0.108,0.533],[0.108,0.306,0.283],[-0.108,-0.306,0.283],[0.306,0.198,0.283],[-0.306,-0.198,0.283],[-0.198,0.108,0.283],[0.198,-0.108,0.283],[0.108,0.306,0.783],[-0.108,-0.306,0.783],[0.306,0.198,0.783],[-0.306,-0.198,0.783],[-0.198,0.108,0.783],[0.198,-0.108,0.783]];
  const Al12c=[[0,0,0],[0,0,0.5],[1/3,2/3,1/3],[2/3,1/3,5/6],[1/3,2/3,2/3],[2/3,1/3,1/6]];
  const alP=[], oP=[];
  const bonds=new Set();

  for(let ix=0;ix<2;ix++)for(let iy=0;iy<2;iy++)for(let iz=0;iz<2;iz++){
    const sh=[ix,iy,iz];
    for(const[f1,f2,f3]of Al12c){
      const p=toCart(f1+sh[0],f2+sh[1],f3+sh[2]);
      alP.push(p);
      const m=new THREE.Mesh(AlGeo,AlM.clone());
      m.position.copy(p);
      group.add(m);
    }
    for(const[f1,f2,f3]of O18e){
      const p=toCart(f1+sh[0],f2+sh[1],f3+sh[2]);
      oP.push(p);
      const m=new THREE.Mesh(OGeo,OM.clone());
      m.position.copy(p);
      group.add(m);
    }
  }
  for(const al of alP)for(const o of oP){
    const d=al.distanceTo(o);
    if(d<sc(0.2)&&d>0.01){
      const k=Math.min(al.x,o.x)+'-'+Math.max(al.x,o.x);
      if(bonds.has(k))continue;bonds.add(k);
      const dir=new THREE.Vector3().subVectors(o,al),len=dir.length();
      const g=new THREE.CylinderGeometry(sc(0.011),sc(0.011),len,6);
      const m=new THREE.Mesh(g,BM);
      m.position.copy(new THREE.Vector3().addVectors(al,o).multiplyScalar(0.5));
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
      group.add(m);
    }
  }

  // ── Ground ──
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.12}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-sc(c)*2.5; ground.receiveShadow=true;
  scene.add(ground);

  // ── Loop ──
  const clock=new THREE.Clock();
  (function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    group.children.forEach((c,i)=>{
      if(c.isMesh&&c.geometry?.type==='SphereGeometry'&&c.geometry.parameters.radius<sc(0.1)){
        c.scale.setScalar(1+0.04*Math.sin(t*1.5+i*0.3));
      }
    });
    fill.position.x=Math.sin(t*0.4)*5;
    fill.position.z=Math.cos(t*0.3)*5;
    ctrl.update();
    renderer.render(scene,camera);
  })();

} catch(e) {
  errEl.textContent = '错误: ' + e.message;
  errEl.classList.add('on');
  okEl.style.display = 'none';
  console.error(e);
}
</script>
</body></html>
