<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刚玉晶体结构 · 3D 交互展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080810;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #e8e8f0;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  #canvas {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  /* ── Overlay UI ── */
  #ui {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
  }
  #title-bar {
    position: absolute;
    top: 24px; left: 28px;
    pointer-events: auto;
  }
  #title-bar h1 {
    font-size: 1.15rem;
    font-weight: 700;
    background: linear-gradient(135deg, #e74c3c, #f0c040, #2980b9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.02em;
  }
  #title-bar p {
    font-size: 0.75rem;
    color: rgba(200,200,220,0.5);
    margin-top: 2px;
    letter-spacing: 0.06em;
  }
  #legend {
    position: absolute;
    top: 24px; right: 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 14px 18px;
    backdrop-filter: blur(8px);
    pointer-events: auto;
  }
  #legend h3 {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: rgba(200,200,220,0.5);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    font-size: 0.82rem;
  }
  .legend-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }
  .dot-al { background: #9b59b6; color: #9b59b6; }
  .dot-o  { background: #e74c3c; color: #e74c3c; }
  .dot-bond { background: #4a9eff; color: #4a9eff; width: 16px; height: 3px; border-radius: 2px; }

  #controls {
    position: absolute;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }
  .ctrl-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(200,200,220,0.8);
    padding: 8px 18px;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.8rem;
    font-family: inherit;
    transition: all 0.2s;
    letter-spacing: 0.04em;
    backdrop-filter: blur(6px);
  }
  .ctrl-btn:hover {
    background: rgba(255,255,255,0.13);
    color: #fff;
    border-color: rgba(255,255,255,0.25);
  }
  .ctrl-btn.active {
    background: rgba(155,89,182,0.3);
    border-color: rgba(155,89,182,0.5);
    color: #d7aefb;
  }

  #info-panel {
    position: absolute;
    bottom: 80px; left: 28px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px 18px;
    max-width: 220px;
    backdrop-filter: blur(8px);
    pointer-events: auto;
  }
  #info-panel h4 {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: rgba(200,200,220,0.45);
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  #info-panel p {
    font-size: 0.78rem;
    color: rgba(200,200,220,0.75);
    line-height: 1.5;
  }
  #info-panel .formula {
    font-size: 0.85rem;
    color: #f0c040;
    font-weight: 600;
    margin-bottom: 6px;
  }

  #loading {
    position: fixed;
    inset: 0;
    background: #080810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.6s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #9b59b6;
    border-right-color: #e74c3c;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { margin-top: 16px; font-size: 0.82rem; color: rgba(200,200,220,0.5); letter-spacing: 0.06em; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>构建晶体模型…</p>
</div>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="title-bar">
    <h1>刚玉 · Corundum 晶体结构</h1>
    <p>Al₂O₃ · 三方晶系 · D⁶₃d-R3c</p>
  </div>

  <div id="legend">
    <h3>图例</h3>
    <div class="legend-item"><div class="legend-dot dot-al"></div>Al³⁺ 铝离子</div>
    <div class="legend-item"><div class="legend-dot dot-o"></div>O²⁻ 氧离子</div>
    <div class="legend-item"><div class="legend-dot dot-bond"></div>Al—O 键</div>
  </div>

  <div id="info-panel">
    <h4>结构参数</h4>
    <div class="formula">Al₂O₃</div>
    <p>空间群：D⁶₃d (R3c)</p>
    <p>晶胞：a=0.477 nm, c=1.304 nm</p>
    <p>Z=6（6 个 Al₂O₃ 单元）</p>
    <p style="margin-top:6px;font-size:0.72rem;color:rgba(200,200,220,0.5)">[AlO₆] 八面体配位</p>
    <p style="margin-top:4px;font-size:0.72rem;color:rgba(200,200,220,0.5)">O²⁻ 密排六方，Al³⁺ 占 2/3 八面体空隙</p>
  </div>

  <div id="controls">
    <button class="ctrl-btn active" id="btn-structure">晶体结构</button>
    <button class="ctrl-btn" id="btn-morphology">晶形外观</button>
    <button class="ctrl-btn" id="btn-hexring">六方环层</button>
    <button class="ctrl-btn" id="btn-cell">晶胞框</button>
    <button class="ctrl-btn" id="btn-sphere">球棍模型</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080810);
scene.fog = new THREE.FogExp2(0x080810, 0.018);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 500);
camera.position.set(8, 6, 10);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2;
controls.maxDistance = 40;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 0, 0);

// ─── Lights ──────────────────────────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xfff0e0, 1.8);
dirLight.position.set(6, 10, 8);
dirLight.castShadow = true;
scene.add(dirLight);

const rimLight = new THREE.DirectionalLight(0x4a9eff, 0.8);
rimLight.position.set(-6, -2, -6);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0x9b59b6, 1.2, 30);
fillLight.position.set(-4, 4, 2);
scene.add(fillLight);

const accentLight = new THREE.PointLight(0xe74c3c, 0.7, 20);
accentLight.position.set(4, -3, -3);
scene.add(accentLight);

// ─── Crystal Structure Constants ────────────────────────────────────
// Hexagonal conventional cell: a=b=0.477nm, c=1.304nm
const a = 0.477;   // nm → use as visual scale unit
const c = 1.304;
const SCALE = 3.5; // visual scale factor

function scaled(v) { return v * SCALE; }

// ─── Atom Positions (fractional, hexagonal setting) ──────────────────
// Based on standard corundum (Al2O3) structure
// O atoms at 18e positions, Al atoms at 12c positions

// Oxygen 18e positions (hexagonal setting):
// (x, y, z), (-x, -y, z), (y, -x-y, z), (-y, x+y, z), (x-y, -x, z), (-x+y, x, z)
// plus ±(x,y,z+1/2) etc.
const O18e = [
  [0.108, 0.306, 0.033],
  [-0.108, -0.306, 0.033],
  [0.306, 0.198, 0.033],
  [-0.306, -0.198, 0.033],
  [-0.198, 0.108, 0.033],
  [0.198, -0.108, 0.033],
  // z+1/2 layer
  [0.108, 0.306, 0.533],
  [-0.108, -0.306, 0.533],
  [0.306, 0.198, 0.533],
  [-0.306, -0.198, 0.533],
  [-0.198, 0.108, 0.533],
  [0.198, -0.108, 0.533],
  // z+1/4 layer
  [0.108, 0.306, 0.283],
  [-0.108, -0.306, 0.283],
  [0.306, 0.198, 0.283],
  [-0.306, -0.198, 0.283],
  [-0.198, 0.108, 0.283],
  [0.198, -0.108, 0.283],
  // z+3/4 layer
  [0.108, 0.306, 0.783],
  [-0.108, -0.306, 0.783],
  [0.306, 0.198, 0.783],
  [-0.306, -0.198, 0.783],
  [-0.198, 0.108, 0.783],
  [0.198, -0.108, 0.783],
];

// Al 12c positions (hexagonal):
// (0, 0, z), (0, 0, z+1/2), (1/3, 2/3, z+1/3), (2/3, 1/3, z+2/3) with z=0
const Al12c = [
  [0, 0, 0],
  [0, 0, 0.5],
  [1/3, 2/3, 1/3],
  [2/3, 1/3, 5/6],
  [1/3, 2/3, 2/3],
  [2/3, 1/3, 1/6],
];

// ─── Fractional → Cartesian ─────────────────────────────────────────
function toCartesian(fx, fy, fz) {
  // Hexagonal: x = a*(fx - fy/2), y = a*(fy*sqrt3/2), z = c*fz
  const x = a * (fx - fy / 2);
  const y = a * (fy * Math.sqrt(3) / 2);
  const z = c * fz;
  return new THREE.Vector3(scaled(x), scaled(z - c/2), scaled(y));
}

// ─── Materials ─────────────────────────────────────────────────────
const AlMat = new THREE.MeshPhysicalMaterial({
  color: 0x9b59b6,
  metalness: 0.6,
  roughness: 0.25,
  emissive: 0x3d1a5c,
  emissiveIntensity: 0.3,
});
const AlEdgeMat = new THREE.MeshStandardMaterial({
  color: 0xd7aefb,
  metalness: 0.9,
  roughness: 0.1,
  emissive: 0x9b59b6,
  emissiveIntensity: 0.4,
});
const OMat = new THREE.MeshPhysicalMaterial({
  color: 0xe74c3c,
  metalness: 0.0,
  roughness: 0.4,
  emissive: 0x7a1a0a,
  emissiveIntensity: 0.2,
});
const OEdgeMat = new THREE.MeshStandardMaterial({
  color: 0xffc0b0,
  metalness: 0.7,
  roughness: 0.2,
  emissive: 0xe74c3c,
  emissiveIntensity: 0.3,
});
const bondMat = new THREE.MeshStandardMaterial({
  color: 0x4a9eff,
  metalness: 0.4,
  roughness: 0.5,
  emissive: 0x1a4a8a,
  emissiveIntensity: 0.2,
  transparent: true,
  opacity: 0.55,
});
const cellMat = new THREE.MeshStandardMaterial({
  color: 0xf0c040,
  metalness: 0.3,
  roughness: 0.5,
  transparent: true,
  opacity: 0.18,
  wireframe: true,
});
const hexRingMat = new THREE.MeshStandardMaterial({
  color: 0x4a9eff,
  metalness: 0.5,
  roughness: 0.3,
  transparent: true,
  opacity: 0.7,
  emissive: 0x1a4a8a,
  emissiveIntensity: 0.3,
});
const morphMat = new THREE.MeshPhysicalMaterial({
  color: 0xc0392b,
  metalness: 0.2,
  roughness: 0.35,
  transparent: true,
  opacity: 0.75,
  side: THREE.DoubleSide,
});

// ─── Atom Geometries ────────────────────────────────────────────────
const AlGeo = new THREE.SphereGeometry(scaled(0.077), 32, 32);
const OGeo  = new THREE.SphereGeometry(scaled(0.14),  32, 32);
const BondGeo = new THREE.CylinderGeometry(scaled(0.012), scaled(0.012), 1, 8);

// ─── Build Unit Cell ───────────────────────────────────────────────
const unitCellGroup = new THREE.Group();
unitCellGroup.name = 'unitCell';
scene.add(unitCellGroup);

// Build structure with 2x2x2 supercell for better visualization
const superN = 2; // 2x2x2 supercell

// Track added bonds to avoid duplicates
const addedBonds = new Set();

function addAtom(group, mat, pos, scale = 1.0) {
  const m = new THREE.Mesh(
    scale > 1 ? AlGeo.clone().scale(new THREE.Vector3(scale,scale,scale)) : AlGeo,
    mat
  );
  m.position.copy(pos);
  m.castShadow = true;
  group.add(m);
  return m;
}

function addOAtom(group, mat, pos) {
  const m = new THREE.Mesh(OGeo, mat);
  m.position.copy(pos);
  m.castShadow = true;
  group.add(m);
  return m;
}

function addBond(group, mat, p1, p2) {
  const key = `${p1.x.toFixed(3)},${p1.y.toFixed(3)},${p1.z.toFixed(3)}-${p2.x.toFixed(3)},${p2.y.toFixed(3)},${p2.z.toFixed(3)}`;
  const rev = `${p2.x.toFixed(3)},${p2.y.toFixed(3)},${p2.z.toFixed(3)}-${p1.x.toFixed(3)},${p1.y.toFixed(3)},${p1.z.toFixed(3)}`;
  if (addedBonds.has(key) || addedBonds.has(rev)) return;
  addedBonds.add(key);

  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  if (len < 0.001 || len > scaled(0.5)) return;

  const geo = new THREE.CylinderGeometry(scaled(0.012), scaled(0.012), len, 6);
  const mesh = new THREE.Mesh(geo, mat);
  const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  group.add(mesh);
}

// ─── Crystal Structure Layer ────────────────────────────────────────
// Build full 2x2x2 supercell
const alAtoms = [];
const oAtoms  = [];

for (let ix = 0; ix < superN; ix++) {
  for (let iy = 0; iy < superN; iy++) {
    for (let iz = 0; iz < superN; iz++) {
      const shift = new THREE.Vector3(ix, iy, iz);

      // Al atoms
      for (const [fx, fy, fz] of Al12c) {
        const wf = [fx + shift.x, fy + shift.y, fz + shift.z];
        const pos = toCartesian(wf[0], wf[1], wf[2]);
        alAtoms.push(pos);
        addAtom(unitCellGroup, AlMat, pos);
      }

      // O atoms
      for (const [fx, fy, fz] of O18e) {
        const wf = [fx + shift.x, fy + shift.y, fz + shift.z];
        const pos = toCartesian(wf[0], wf[1], wf[2]);
        oAtoms.push(pos);
        addOAtom(unitCellGroup, OMat, pos);
      }
    }
  }
}

// Build bonds: each Al connects to 6 O neighbors
// Approximate Al-O distance and connect
const AlORadius = scaled(0.19); // approximate Al-O bond length
for (const al of alAtoms) {
  for (const o of oAtoms) {
    const dist = al.distanceTo(o);
    if (dist < AlORadius && dist > 0.01) {
      addBond(unitCellGroup, bondMat, al, o);
    }
  }
}

// ─── Unit Cell Frame ────────────────────────────────────────────────
const cellVerts = [
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(scaled(a), 0, 0),
  new THREE.Vector3(scaled(a/2), 0, scaled(a * Math.sqrt(3)/2)),
  new THREE.Vector3(scaled(a/2), 0, scaled(a * Math.sqrt(3)/6)),
  new THREE.Vector3(scaled(a) + scaled(a/2), 0, scaled(a * Math.sqrt(3)/6)),
  new THREE.Vector3(scaled(a) + scaled(a/2), 0, scaled(a * Math.sqrt(3)/2)),
  new THREE.Vector3(scaled(a), scaled(c), 0),
  new THREE.Vector3(scaled(a)*2, scaled(c), 0),
  new THREE.Vector3(scaled(a)*1.5, scaled(c), scaled(a * Math.sqrt(3)/2)),
  new THREE.Vector3(scaled(a)*1.5, scaled(c), scaled(a * Math.sqrt(3)/6)),
  new THREE.Vector3(scaled(a)*2.5, scaled(c), scaled(a * Math.sqrt(3)/6)),
  new THREE.Vector3(scaled(a)*2.5, scaled(c), scaled(a * Math.sqrt(3)/2)),
];

// Draw hexagonal prism cell frame
function createHexPrismCell() {
  const group = new THREE.Group();
  group.name = 'cellFrame';

  const r = scaled(a);
  const h = scaled(c);
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (i * 60 - 30) * Math.PI / 180;
    pts.push(new THREE.Vector3(r * Math.cos(angle), 0, r * Math.sin(angle)));
  }

  const edges = [
    [0,1],[1,5],[5,4],[4,3],[3,2],[2,0],  // bottom ring
    [6,7],[7,11],[11,10],[10,9],[9,8],[8,6], // top ring
    [0,6],[1,7],[5,11],[4,10],[3,9],[2,8],  // verticals
  ];

  for (const [i, j] of edges) {
    const geo = new THREE.BufferGeometry().setFromPoints([cellVerts[i], cellVerts[j]]);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: 0xf0c040, transparent: true, opacity: 0.6
    }));
    group.add(line);
  }
  return group;
}
const cellFrame = createHexPrismCell();
cellFrame.visible = false;
scene.add(cellFrame);

// ─── Hexagonal Ring Layer View ──────────────────────────────────────
function createHexRingLayer(yFrac) {
  const group = new THREE.Group();
  const r = scaled(a * 0.95);
  const y = scaled(c * yFrac);
  const pts = [];
  for (let i = 0; i < 7; i++) {
    const angle = (i * 60 - 30) * Math.PI / 180;
    pts.push(new THREE.Vector3(r * Math.cos(angle), y, r * Math.sin(angle)));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0x4a9eff, transparent: true, opacity: 0.8
  }));
  group.add(line);

  // Filled hexagon
  const shape = new THREE.Shape();
  for (let i = 0; i < 6; i++) {
    const angle = (i * 60 - 30) * Math.PI / 180;
    const x = r * Math.cos(angle);
    const z = r * Math.sin(angle);
    if (i === 0) shape.moveTo(x, z);
    else shape.lineTo(x, z);
  }
  shape.closePath();
  const extSettings = { depth: 0.008, bevelEnabled: false };
  const extGeo = new THREE.ExtrudeGeometry(shape, extSettings);
  const mesh = new THREE.Mesh(extGeo, hexRingMat.clone());
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = y - 0.004;
  group.add(mesh);
  return group;
}

const hexLayers = [];
for (let iz = 0; iz <= 4; iz++) {
  hexLayers.push(createHexRingLayer(iz * 0.25));
  hexLayers[hexLayers.length-1].visible = false;
  scene.add(hexLayers[hexLayers.length-1]);
}

// ─── Morphology: Hexagonal Prism Crystal ──────────────────────────
function createCrystalMorphology() {
  const group = new THREE.Group();
  group.name = 'morphology';

  const h = scaled(c) * 1.6;
  const r = scaled(a) * 1.1;

  // Hexagonal prism body
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (i * 60 - 30) * Math.PI / 180;
    pts.push(new THREE.Vector2(r * Math.cos(angle), r * Math.sin(angle)));
  }
  const shape = new THREE.Shape(pts);

  const extSettings = {
    depth: h,
    bevelEnabled: true,
    bevelThickness: 0.02,
    bevelSize: 0.02,
    bevelSegments: 2,
  };
  const geo = new THREE.ExtrudeGeometry(shape, extSettings);
  const prism = new THREE.Mesh(geo, morphMat.clone());
  prism.position.y = -h / 2;
  prism.castShadow = true;
  group.add(prism);

  // Top hexagonal pyramid (basal pinacoid / hexagonal bipyramid)
  const pyrGeo = new THREE.ConeGeometry(r * 1.02, h * 0.35, 6, 1);
  const pyr = new THREE.Mesh(pyrGeo, morphMat.clone());
  pyr.position.y = h / 2 + h * 0.175;
  pyr.castShadow = true;
  group.add(pyr);

  // Bottom
  const pyrGeoB = new THREE.ConeGeometry(r * 1.02, h * 0.35, 6, 1);
  const pyrB = new THREE.Mesh(pyrGeoB, morphMat.clone());
  pyrB.position.y = -h / 2 - h * 0.175;
  pyrB.rotation.x = Math.PI;
  pyrB.castShadow = true;
  group.add(pyrB);

  // Color bands (hexagonal color zones)
  for (let band = 0; band < 5; band++) {
    const bandY = -h * 0.5 + h * (band / 5);
    const bandH = h * 0.08;
    const bandGeo = new THREE.CylinderGeometry(r + 0.01, r + 0.01, bandH, 6);
    const bandMat = new THREE.MeshPhysicalMaterial({
      color: band % 2 === 0 ? 0xc0392b : 0x1a4a8a,
      metalness: 0.3,
      roughness: 0.4,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide,
    });
    const bandMesh = new THREE.Mesh(bandGeo, bandMat);
    bandMesh.position.y = bandY + bandH / 2;
    group.add(bandMesh);
  }

  // Vertical stripes showing hexagonal habit
  for (let i = 0; i < 6; i++) {
    const angle = (i * 60 - 30) * Math.PI / 180;
    const x = r * Math.cos(angle) * 1.002;
    const z = r * Math.sin(angle) * 1.002;
    const geo = new THREE.CylinderGeometry(0.015, 0.015, h * 1.75, 6);
    const stripe = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: 0xf0c040, metalness: 0.6, roughness: 0.3,
      transparent: true, opacity: 0.5,
    }));
    stripe.position.set(x, 0, z);
    group.add(stripe);
  }

  return group;
}

const morphGroup = createCrystalMorphology();
morphGroup.visible = false;
scene.add(morphGroup);

// ─── Sphere Model ───────────────────────────────────────────────────
let showingSpheres = false;
function toggleSpheres(show) {
  showingSpheres = show;
  const spheres = unitCellGroup.children.filter(c => c.isMesh && c.geometry.type === 'SphereGeometry');
  spheres.forEach(s => {
    if (show) {
      s.material = s.geometry.parameters.radius > scaled(0.1) ? OMat.clone() : AlMat.clone();
      s.material.transparent = true;
      s.material.opacity = 0.9;
    } else {
      s.material.transparent = false;
      s.material.opacity = 1.0;
    }
  });
  // Hide bonds when showing pure sphere model
  unitCellGroup.children.filter(c => c.geometry?.type === 'CylinderGeometry')
    .forEach(b => { b.visible = !show; });
}

// ─── Mode Controls ──────────────────────────────────────────────────
let currentMode = 'structure';

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode)?.classList.add('active');

  // Reset all
  unitCellGroup.visible = false;
  morphGroup.visible = false;
  cellFrame.visible = false;
  hexLayers.forEach(l => l.visible = false);

  switch (mode) {
    case 'structure':
      unitCellGroup.visible = true;
      unitCellGroup.children.forEach(c => c.visible = true);
      break;
    case 'morphology':
      morphGroup.visible = true;
      break;
    case 'hexring':
      unitCellGroup.visible = true;
      unitCellGroup.children.forEach(c => c.visible = false);
      hexLayers.forEach(l => l.visible = true);
      break;
    case 'cell':
      unitCellGroup.visible = true;
      cellFrame.visible = true;
      break;
    case 'sphere':
      unitCellGroup.visible = true;
      unitCellGroup.children.forEach(c => c.visible = true);
      break;
  }
}

document.getElementById('btn-structure').addEventListener('click', () => setMode('structure'));
document.getElementById('btn-morphology').addEventListener('click', () => setMode('morphology'));
document.getElementById('btn-hexring').addEventListener('click', () => setMode('hexring'));
document.getElementById('btn-cell').addEventListener('click', () => setMode('cell'));
document.getElementById('btn-sphere').addEventListener('click', () => setMode('sphere'));

// ─── Ground Plane ───────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.15 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -scaled(c) * 2;
ground.receiveShadow = true;
scene.add(ground);

// Subtle grid
const gridHelper = new THREE.GridHelper(30, 30, 0x1a2a4a, 0x0a1520);
gridHelper.position.y = -scaled(c) * 2 + 0.01;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.4;
scene.add(gridHelper);

// ─── Resize ────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Animation ──────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Subtle pulse on Al atoms
  unitCellGroup.children.forEach((child, i) => {
    if (child.isMesh && child.geometry?.type === 'SphereGeometry') {
      const isAl = child.geometry.parameters.radius < scaled(0.1);
      if (isAl) {
        const pulse = 1 + 0.04 * Math.sin(t * 1.5 + i * 0.3);
        child.scale.setScalar(pulse);
      }
    }
  });

  // Fill light animation
  fillLight.position.x = Math.sin(t * 0.4) * 5;
  fillLight.position.z = Math.cos(t * 0.3) * 5;

  controls.update();
  renderer.render(scene, camera);
}

// ─── Start ──────────────────────────────────────────────────────────
setMode('structure');
document.getElementById('loading').classList.add('hidden');
animate();

</script>
</body>
