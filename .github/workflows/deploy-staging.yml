name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          external_repository: soli0x4ea/gemology-notes-staging
          publish_branch: main
          publish_dir: .
          exclude_assets: '.github,.git,.gitignore,LICENSE'
          commit_message: 'deploy: staging ${{ github.sha }}'
          force_orphan: true
